name: Tag pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: docker compose run --rm tests

      - name: Check memory
        run: >
          docker compose run --rm tests
          valgrind
          --leak-check=full
          --show-leak-kinds=definite,indirect
          --errors-for-leak-kinds=definite,indirect
          --track-origins=yes
          --error-exitcode=1
          ./tividy_tests

  ci:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tividy:${{ github.ref_name }} .

      - name: Extract binary
        run: |
          docker create --name tividy-extract tividy:${{ github.ref_name }}
          docker cp tividy-extract:/app/tividy ./tividy
          docker rm tividy-extract

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tividy
          path: tividy
          if-no-files-found: error

  cd:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: tividy

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: tividy
          fail_on_unmatched_files: true
          generate_release_notes: true
